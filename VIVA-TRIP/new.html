
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viva Trip - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>VIVA TRIP</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="produto.html">Destinos</a>
            <a href="login.html">Login</a>
            <a href="new.html">Cadastro</a>
        </nav>
    </header>

    <main class="formulario">
        <h2>Crie sua conta</h2>
        <p>Faça seu cadastro para conhecer nossos destinos.</p>

        <form action="#" method="get">
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Crie uma senha" required>

            <label for="confirmar">Confirmar senha:</label>
            <input type="password" id="confirmar" placeholder="Repita sua senha" required>

            <button type="submit">Cadastrar</button>
        </form>

        <p>Já possui uma conta?</p>
        <a href="login.html">Faça login</a>
    </main>

    <footer>
        <p>Viva Trip - Sua próxima viagem começa aqui!</p>
        <p>© 2026 - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
